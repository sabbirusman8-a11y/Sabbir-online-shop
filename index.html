<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabbir Online Shop</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;padding:20px}header{background:#087f5b;color:white;padding:20px;border-radius:12px}section{background:white;margin-top:18px;padding:18px;border-radius:12px}input,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#087f5b;color:white;border:0;border-radius:8px} .product{border:1px solid #ddd;padding:12px;margin-top:10px;border-radius:8px}</style>
</head>
<body>
<header><h2>Sabbir Online Shop</h2><p>আপনার অনলাইন দোকান</p></header>
<section><h3>নতুন পণ্য যোগ করুন</h3><input id="name" placeholder="পণ্যের নাম"><input id="price" type="number" placeholder="পণ্যের দাম (টাকা)"><button onclick="addProduct()">পণ্য যোগ করুন</button></section>
<section><h3>আমাদের পণ্য</h3><div id="products">এখনো কোনো পণ্য যোগ করা হয়নি।</div></section>
<script>function addProduct(){let n=document.getElementById("name").value.trim(),p=document.getElementById("price").value;if(!n||!p){alert("পণ্যের নাম ও দাম লিখুন");return}let d=document.createElement("div");d.className="product";d.textContent=n+" — ৳"+p;document.getElementById("products").appendChild(d);document.getElementById("name").value="";document.getElementById("price").value=""}</script>
</body>
</html>
